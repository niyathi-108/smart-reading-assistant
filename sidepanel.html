<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart Reading Assistant</title>
  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('fonts/OpenDyslexic-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('fonts/OpenDyslexic-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('fonts/OpenDyslexic-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('fonts/OpenDyslexic-BoldItalic.otf') format('opentype');
      font-weight: bold;
      font-style: italic;
    }

    body {
      font-family: 'Times New Roman', Times, serif;
      padding: 12px;
      background-color: #f5f5f5;
    }
    h2 { margin-top: 0; }
    #actionDropdown {
      width: 180px;
      padding: 6px;
      margin-right: 10px;
    }
    #runBtn {
      padding: 6px 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #runBtn:hover { background-color: #45a049; }
    #styleControls {
      margin-top: 15px;
      padding: 10px;
      background-color: #e9e9e9;
      border-radius: 6px;
    }
    #output {
      margin-top: 15px;
      width: 100%;
      min-height: 300px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .large-font { font-size: 20px !important; }
    .high-contrast { background-color: #000 !important; color: #fff !important; }
    .dyslexia-font { font-family: 'OpenDyslexic', Arial, sans-serif !important; }
    .extra-spacing { line-height: 1.8 !important; letter-spacing: 0.05em !important; }
  </style>
</head>
<body>
  <h2>Smart Reading Assistant</h2>
  <select id="actionDropdown">
    <option value="define">Define</option>
    <option value="summarize">Summarize</option>
    <option value="expand">Expand Text</option>
    <option value="synonyms">Synonyms</option>
    <option value="simplify">Simplify Language</option>
    <option value="analogy">Analogy Helper</option>
    <option value="steps">Step-by-Step Breakdown</option>
  </select>
  <button id="runBtn">Run</button>
  <button id="stopReadBtn" style="display:none;">Stop Reading</button>
  <div id="styleControls">
    <label><input type="checkbox" id="largeFont"> Large Font</label><br>
    <label><input type="checkbox" id="highContrast"> High Contrast</label><br>
    <label><input type="checkbox" id="dyslexiaFont"> Dyslexia-Friendly Font</label><br>
    <label><input type="checkbox" id="extraSpacing"> Extra Spacing</label><br>
    <button id="readAloudBtn">Read Aloud</button>
  </div>

  <div id="output">Select text on the page, choose an action, and click Run.</div>

  <script src="sidepanel.js"></script>
</body>
</html>
